name: CodeQL

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  schedule:
    # Every Monday at 3:15 AM UTC
    - cron: "15 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initialize CodeQL tools
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript  # Language to analyze

      # Build code (CodeQL needs build for compiled languages)
      # For JavaScript, autobuild works
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      # Run CodeQL analysis
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"