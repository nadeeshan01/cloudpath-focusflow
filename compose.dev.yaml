name: cloudpath-focusflow-dev

services:
  api:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    container_name: focusflow-api-dev
    env_file:
      - ./app/.env
    environment:
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - ./app/src:/app/src
    command: npm run dev

  frontend:
    image: node:22-alpine
    container_name: focusflow-web-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: /api/v1
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

volumes:
  frontend-node-modules: