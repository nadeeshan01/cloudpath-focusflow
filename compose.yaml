name: cloudpath-focusflow

services:
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: focusflow-api:0.1.0
    container_name: focusflow-api
    env_file:
      - ./app/.env
    ports:
      - "5000:5000"
    restart: unless-stopped
    
    # Security hardening
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    
    # Health check
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3