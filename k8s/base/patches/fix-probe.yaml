apiVersion: apps/v1
kind: Deployment
metadata:
  name: focusflow-api
  namespace: cloudpath

spec:
  template:
    spec:
      containers:
        - name: focusflow-api
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3