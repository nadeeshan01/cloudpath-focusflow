apiVersion: apps/v1
kind: Deployment
metadata:
  name: focusflow-web
  namespace: cloudpath
  labels:
    app.kubernetes.io/name: focusflow-web
    app.kubernetes.io/part-of: cloudpath-focusflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: focusflow-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: focusflow-web
        app.kubernetes.io/part-of: cloudpath-focusflow
    spec:
      containers:
        - name: focusflow-web
          image: focusflow-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20