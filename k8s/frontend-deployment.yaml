apiVersion: apps/v1
kind: Deployment
metadata:
  name: focusflow-web
  namespace: cloudpath
  labels:
    app.kubernetes.io/name: focusflow-web
    app.kubernetes.io/part-of: cloudpath-focusflow
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: focusflow-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: focusflow-web
        app.kubernetes.io/part-of: cloudpath-focusflow
        app.kubernetes.io/version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: focusflow-web
          image: focusflow-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: focusflow-config
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3